<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" role="img" aria-label="The Fitness 71 crest">
  <title>The Fitness 71</title>
  <defs>
    <linearGradient id="f71-flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#9E1015"/>
      <stop offset=".38" stop-color="#E8232B"/>
      <stop offset=".74" stop-color="#F26B1D"/>
      <stop offset="1" stop-color="#FFC21A"/>
    </linearGradient>
    <linearGradient id="f71-steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".62" stop-color="#E6EAF3"/>
      <stop offset="1" stop-color="#AEB9CC"/>
    </linearGradient>
    <linearGradient id="f71-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18233C"/>
      <stop offset="1" stop-color="#070A12"/>
